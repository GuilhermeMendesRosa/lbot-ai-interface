<div class="layout">
  <div class="simulator-container">
    <app-robo-simulator [showGoals]="currentMode === 'chat'"></app-robo-simulator>
  </div>
  <div class="phone-container">
    <div class="mode-toggle">
      <button 
        class="mode-btn" 
        [class.active]="currentMode === 'chat'"
        (click)="switchMode('chat')">
        <lucide-icon [img]="MessageCircleIcon" [size]="16" style="vertical-align: middle; margin-right: 4px;"></lucide-icon>Chat
      </button>
      <button 
        class="mode-btn" 
        [class.active]="currentMode === 'controls'"
        (click)="switchMode('controls')">
        <lucide-icon [img]="Gamepad2Icon" [size]="16" style="vertical-align: middle; margin-right: 4px;"></lucide-icon>Controles
      </button>
    </div>
    
    <div class="content-wrapper">
      <app-lbot-chat *ngIf="currentMode === 'chat'"></app-lbot-chat>
      <app-virtual-controls *ngIf="currentMode === 'controls'"></app-virtual-controls>
    </div>
  </div>
</div>
